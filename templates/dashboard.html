{% extends "base.html" %}

{% block content %}

<h2>Análisis del Proyecto</h2>

{% if dashboard_pdf %}
    <div class="dashboard-container">
        <iframe
            src="{{ dashboard_pdf }}"
            width="100%"
            height="900px"
            style="border:none;">
        </iframe>
    </div>
{% else %}
    <p style="margin-top:20px;">
        📊 Este proyecto aún no tiene un dashboard cargado.
    </p>
{% endif %}

{% endblock %}
