{% extends "base.html" %}

{% block content %}

<div style="text-align:center; margin-bottom:25px;">
    <h2 style="margin:0; font-weight:600;">📊 Informe del Proyecto</h2>
    <div style="width:60px;height:4px;background:#6b7280;margin:8px auto 0;border-radius:4px;"></div>
</div>
<hr>

{% if proyecto.dashboard_powerbi_url %}

<div style="
    width:100%;
    height:80vh;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
">
    <iframe
        src="{{ proyecto.dashboard_powerbi_url }}"
        width="100%"
        height="100%"
        frameborder="0"
        allowfullscreen="true">
    </iframe>
</div>

{% else %}

<div style="
    margin-top:40px;
    padding:25px;
    background:#fff3cd;
    border:1px solid #ffeeba;
    border-radius:10px;
">
    ⚠️ Este proyecto aún no tiene un dashboard de Power BI configurado.
</div>

{% endif %}

{% endblock %}
